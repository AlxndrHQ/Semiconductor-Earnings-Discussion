name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Nightly at 07:00 UTC (2am EST / 3am EDT), after after-hours reports land.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the nightly run commit refreshed live-earnings.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh live earnings from Finnhub
        id: refresh
        run: |
          node scripts/update-earnings.mjs
          if git diff --quiet -- src/data/live-earnings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          FINNHUB_KEY: ${{ secrets.VITE_FINNHUB_KEY }}

      - name: Commit refreshed data
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-earnings.json
          git commit -m "Data: nightly live earnings refresh"
          git pull --rebase origin main
          git push origin HEAD:main

      # On the nightly schedule, only rebuild when the numbers changed.
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.refresh.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.gate.outputs.deploy == 'true'
        run: npm run build
        env:
          VITE_FINNHUB_KEY: ${{ secrets.VITE_FINNHUB_KEY }}

      - name: Setup Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
